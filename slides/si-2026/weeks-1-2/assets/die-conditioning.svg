  <g font-family="Georgia, Times New Roman, serif" font-size="30" text-anchor="middle">
    <g fill="#17313b">
      <text x="517" y="109">1</text><text x="1287" y="109">1</text><text x="1391" y="109">3</text>
      <text x="382" y="28">B = {1,2}</text><text x="1152" y="28">C = {1,2,3}</text>
      <text x="382" y="70" fill="#996a08" font-style="italic">B</text><text x="1152" y="70" fill="#996a08" font-style="italic">C</text>
      <text x="382" y="193">ℙ(A | B) = 1/2 = ℙ(A)</text>
      <text x="1152" y="193">ℙ(A | C) = 1/3 ≠ 1/2 = ℙ(A)</text>
      <text x="77" y="132" fill="#087f8c" font-style="italic">A</text><text x="847" y="132" fill="#087f8c" font-style="italic">A</text>
    </g>
    <g fill="#fffdf8"><text x="569" y="109">2</text><text x="1339" y="109">2</text></g>
  </g>
</svg>
